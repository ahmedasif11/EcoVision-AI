plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.numberguessingtflite'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.numberguessingtflite"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    // openFd can map linear.tflite only when the APK stores it uncompressed.
    androidResources {
        noCompress 'tflite'
    }
}

dependencies {
    // The original sample declared this with a plus. The checked debug build resolved 2.17.0.
    implementation ("org.tensorflow:tensorflow-lite:+")
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.activity
    implementation libs.androidx.constraintlayout
}
